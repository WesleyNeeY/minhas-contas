<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6754"><title>Minhas Contas · Chat de teste</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#1d302d;background:#eef2ed}button,input{font:inherit}button{cursor:pointer}.shell{max-width:680px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:#f7f6f2}.head{background:linear-gradient(125deg,#0b6754,#118a70);padding:calc(15px + env(safe-area-inset-top)) 16px 14px;color:white;display:flex;align-items:center;gap:12px}.avatar{background:#fff3;border:1px solid #fff5;border-radius:16px;width:45px;height:45px;display:grid;place-items:center;font-size:24px}.head strong{display:block;font-size:18px}.head small{color:#d9ffed}.head .tag{margin-left:auto;font-size:11px;border:1px solid #fff7;border-radius:30px;padding:5px 9px}.summary{display:flex;gap:10px;padding:12px;background:#f7f6f2}.sum{flex:1;background:white;border:1px solid #e0e9e3;border-radius:16px;padding:12px;box-shadow:0 3px 9px #1232}.sum small{color:#657d76}.sum b{display:block;font-size:19px;margin-top:4px;color:#095b48}.toolbar{display:flex;gap:8px;padding:0 12px 8px}.toolbar button{border:1px solid #d5e4de;background:white;padding:9px 12px;border-radius:99px;font-size:13px;font-weight:650}.messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 90% 3%,#e4efe8,#f7f6f2 55%)}.bubble{max-width:87%;white-space:pre-wrap;overflow-wrap:anywhere;padding:13px 15px;border-radius:18px;line-height:1.42;box-shadow:0 2px 8px #1531}.bubble.me{align-self:flex-end;background:#dcf6e7;border-bottom-right-radius:5px}.bubble.bot{align-self:flex-start;background:white;border-bottom-left-radius:5px}.inputbar{background:white;border-top:1px solid #e5ebe6;display:flex;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}.inputbar input{min-width:0;flex:1;border:1px solid #dce4dd;border-radius:16px;padding:13px 12px;outline-color:#0b6754}.inputbar button{border:0;border-radius:14px;padding:0 15px;background:#0b6754;color:white;font-weight:700}.inputbar .mic{background:#e4f1eb;color:#09614d;font-size:20px;padding:0 12px}.view{position:absolute;inset:0;background:#f7f6f2;z-index:10;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px;max-width:680px;margin:auto}.view[hidden]{display:none}.view h2{margin:10px 0 18px}.back{background:#0b6754;color:white;border:0;border-radius:12px;padding:10px 18px}.entry{background:white;margin:9px 0;padding:14px;border-radius:14px;display:flex;justify-content:space-between;gap:12px;border:1px solid #e2e9e3}.entry small{display:block;color:#64736d;margin-top:3px}.delete{background:transparent;border:0;color:#9e3d2f;padding:4px}.empty{color:#6c7772}.disclaimer{font-size:11px;color:#7e8a83;text-align:center;padding:6px}
</style></head><body>
<div class="shell"><div class="head"><div class="avatar">💬</div><div><strong>Minhas Contas</strong><small>Seu assistente financeiro</small></div><span class="tag">MODO TESTE</span></div>
<div class="summary"><div class="sum"><small>Gastos registrados</small><b id="total">R$ 0,00</b></div><div class="sum"><small>Lembretes</small><b id="qtd">0</b></div></div>
<div class="toolbar"><button id="abrirGastos">📊 Ver gastos</button><button id="abrirLembretes">🔔 Lembretes</button><button id="limpar">↻ Limpar teste</button></div>
<div id="messages" class="messages" aria-live="polite"></div>
<div class="disclaimer">Teste sem login · dados somente neste navegador · não envia alertas com o app fechado</div>
<form id="form" class="inputbar"><input id="texto" autocomplete="off" placeholder="Digite um gasto ou lembrete..." aria-label="Sua mensagem"><button type="button" class="mic" id="mic" aria-label="Falar">🎙️</button><button type="submit">➤</button></form></div>
<section class="view" id="view" hidden><button id="voltar" class="back">← Voltar ao chat</button><h2 id="titulo"></h2><div id="items"></div></section>
<script>
const KEY='minhas-contas-chat-demo-v2';
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!data||!Array.isArray(data.gastos)||!Array.isArray(data.lembretes))data={gastos:[],lembretes:[]};
let pendente=null;
const el=id=>document.getElementById(id),brl=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function salvar(){localStorage.setItem(KEY,JSON.stringify(data));resumo()}
function resumo(){el('total').textContent=brl(data.gastos.reduce((n,g)=>n+g.valor,0));el('qtd').textContent=data.lembretes.length}
function dizer(msg,eu=false){let b=document.createElement('div');b.className='bubble '+(eu?'me':'bot');b.textContent=msg;el('messages').appendChild(b);el('messages').scrollTop=el('messages').scrollHeight}
function soTexto(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function valorDo(s){let match=s.match(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[,.]\d{1,2})?)\s*(?:reais?)?/i);if(!match)return null;let v=match[1];if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=Number(v);return Number.isFinite(n)&&n>0&&n<1000000?{n,raw:match[0]}:null}
function dataDo(s){let m=s.match(/\bdia\s+(\d{1,2})(?:\s*\/\s*(\d{1,2}))?(?:\s*\/\s*(\d{4}))?\b/i)||s.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{4}))?\b/);if(!m)return null;const hoje=new Date(),dia=+m[1],mes=m[2]?+m[2]:hoje.getMonth()+1,ano=m[3]?+m[3]:hoje.getFullYear();let dt=new Date(ano,mes-1,dia);if(dt.getDate()!==dia||dt.getMonth()!==mes-1)return null;if(!m[2]&&dt<new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()))dt.setMonth(dt.getMonth()+1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function processar(s){s=String(s||'').trim();if(!s)return;dizer(s,true);let n=soTexto(s);
if(pendente){if(/^(sim|confirmar|confirmo|ok)$/.test(n)){if(pendente.tipo==='gasto'){data.gastos.push({...pendente.item,id:Date.now()});dizer('✅ Gasto registrado: '+pendente.item.nome+' — '+brl(pendente.item.valor)+'.')}else{data.lembretes.push({...pendente.item,id:Date.now()});dizer('🔔 Lembrete registrado para '+pendente.item.data.split('-').reverse().join('/')+'.\nVocê poderá consultá-lo na aba Lembretes.');}pendente=null;salvar();return}if(/^(nao|cancelar|não)$/.test(n)){pendente=null;dizer('Tudo bem, cancelei.');return}pendente=null}
if(/quanto gastei|total|resumo/.test(n)){dizer('📊 Total registrado neste teste: '+brl(data.gastos.reduce((a,g)=>a+g.valor,0))+'.');return}
if(/lembra|lembrete|lembrar/.test(n)){let d=dataDo(n);if(!d){dizer('Me diga o dia. Exemplo: "Me lembra de pagar a luz dia 15/11".');return}let nome=s.replace(/^(me\s+)?lembra(?:r|ete)?\s*(de\s*)?/i,'').trim();pendente={tipo:'lembrete',item:{nome,data:d}};dizer('🔔 Criar lembrete "'+nome+'" para '+d.split('-').reverse().join('/')+'?\nResponda SIM ou CANCELAR.');return}
if(/gastei|comprei|paguei|despesa|gasto/.test(n)){let v=valorDo(s);if(!v){dizer('Qual foi o valor? Exemplo: "Gastei R$ 30 no mercado".');return}let nome=s.replace(v.raw,' ').replace(/\b(gastei|comprei|paguei|despesa|gasto|reais|no|na|em|com|de|hoje)\b/gi,' ').replace(/\s+/g,' ').trim()||'Despesa';pendente={tipo:'gasto',item:{nome,valor:v.n,data:new Date().toISOString().slice(0,10)}};dizer('💰 Registrar '+brl(v.n)+' em "'+nome+'"?\nResponda SIM ou CANCELAR.');return}
dizer('Você pode dizer:\n• Gastei R$ 30 no mercado\n• Me lembra de pagar internet dia 15/11\n• Quanto gastei?')}
function ver(tipo){el('view').hidden=false;el('titulo').textContent=tipo==='gastos'?'📊 Gastos registrados':'🔔 Seus lembretes';el('items').replaceChildren();const arr=tipo==='gastos'?data.gastos:data.lembretes;if(!arr.length){let p=document.createElement('p');p.className='empty';p.textContent='Ainda não há registros.';el('items').appendChild(p)}arr.slice().reverse().forEach(x=>{let d=document.createElement('div');d.className='entry';let info=document.createElement('div');let strong=document.createElement('strong');strong.textContent=x.nome;let small=document.createElement('small');small.textContent=tipo==='gastos'?brl(x.valor)+' · '+x.data:x.data.split('-').reverse().join('/');info.append(strong,small);let b=document.createElement('button');b.className='delete';b.textContent='Excluir';b.onclick=()=>{data[tipo]=data[tipo].filter(y=>y.id!==x.id);salvar();ver(tipo)};d.append(info,b);el('items').appendChild(d)})}
el('form').onsubmit=e=>{e.preventDefault();let v=el('texto').value;el('texto').value='';processar(v)};el('abrirGastos').onclick=()=>ver('gastos');el('abrirLembretes').onclick=()=>ver('lembretes');el('voltar').onclick=()=>el('view').hidden=true;el('limpar').onclick=()=>{if(confirm('Apagar os registros deste teste neste navegador?')){data={gastos:[],lembretes:[]};salvar();el('messages').replaceChildren();pendente=null;dizer('Tudo limpo! Vamos começar de novo?')}};el('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){dizer('O reconhecimento de voz não está disponível neste navegador. Você pode tocar no microfone do teclado do celular.');return}let r=new SR();r.lang='pt-BR';r.onresult=e=>processar(e.results[0][0].transcript);r.onerror=()=>dizer('Não consegui reconhecer o áudio. Confira a permissão do microfone.');try{r.start()}catch(e){dizer('Não foi possível abrir o microfone.')}};
resumo();dizer('Olá! 👋 Eu sou seu assistente Minhas Contas.\n\nMe conte o que você comprou ou peça um lembrete.\n\nExemplo: "Gastei R$ 40 na farmácia".');
</script></body></html>
